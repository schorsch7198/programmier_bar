<style>
  #categoriesTree .category-node {
    display: flex;
    align-items: center;
    gap: .5rem;
    padding: .5rem .75rem;
    border-radius: .375rem;
    cursor: pointer;
    position: relative;
    user-select: none;
    color: var(--bs-body-color);
  }
  #categoriesTree .category-node:hover { background: var(--bs-tertiary-bg); }
  #categoriesTree .chevron-toggle,
  #categoriesTree .chevron-spacer {
    display: inline-block;
    width: 1.25rem;
    text-align: center;
    flex-shrink: 0;
    color: var(--bs-secondary-color);
  }
  #categoriesTree .chevron-toggle { cursor: pointer; }
  #categoriesTree .chevron-toggle:hover { color: var(--bs-primary); }
  #categoriesTree .name {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #categoriesTree .rank-badge {
    font-size: .75rem;
    color: var(--bs-secondary-color);
    background: var(--bs-secondary-bg);
    padding: 0 .5rem;
    border-radius: 1rem;
    min-width: 1.75rem;
    text-align: center;
    flex-shrink: 0;
  }
  #categoriesTree .row-actions {
    opacity: 0;
    transition: opacity .15s ease-in-out;
    display: flex;
    gap: .25rem;
    flex-shrink: 0;
  }
  #categoriesTree .category-node:hover .row-actions,
  #categoriesTree .category-node:focus-within .row-actions { opacity: 1; }
  #categoriesTree .row-actions .btn { padding: .15rem .4rem; line-height: 1; }

  #categoriesTree .empty-state {
    padding: 2rem 1rem;
    text-align: center;
    color: var(--bs-secondary-color);
    border: 1px dashed var(--bs-border-color);
    border-radius: .5rem;
  }
</style>

<div class="container-fluid mb-5 mt-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-10 col-lg-8 col-xxl-6">
      <div class="row align-items-center border-bottom border-2 pb-2">
        <div class="col">
          <h1 class="mb-0">Categories</h1>
        </div>
        <div class="col-auto">
          <button type="button" class="btn btn-secondary" id="buttonNew">
            <i class="bi-plus-lg me-2"></i>New main category
          </button>
        </div>
      </div>

      <div class="input-group input-group-sm mb-3 mt-3">
        <span class="input-group-text bg-transparent"><i class="bi-search"></i></span>
        <input type="search"
               id="inputFilter"
               class="form-control"
               placeholder="Filter categories..."
               aria-label="Filter categories">
      </div>
      <div id="categoriesTree"></div>
    </div>
  </div>
</div>
