<form class="position-relative" role="search" onsubmit="return false;">
  <div class="input-group">
    <span class="input-group-text bg-body-tertiary border-end-0">
      <i class="bi-search"></i>
    </span>
    <input type="search"
           class="form-control border-start-0"
           id="searchBoxInput"
           placeholder="Search products and categories..."
           aria-label="Search products and categories"
           autocomplete="off">
  </div>
  <div class="position-absolute start-0 end-0 mt-1 d-none shadow bg-body border rounded overflow-hidden"
       id="searchBoxDropdown"
       style="top: 100%; z-index: 1040; max-height: 400px; overflow-y: auto;"></div>
</form>
