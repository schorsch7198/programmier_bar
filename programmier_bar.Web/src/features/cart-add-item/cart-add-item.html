<div class="cart-add-item d-inline-flex flex-wrap align-items-center gap-2">
  <input type="number" class="form-control form-control-sm flex-shrink-0"
         id="cartAddQuantity" min="1" value="1" style="width: 4.5rem;" />
  <button type="button" class="btn btn-primary flex-shrink-0" id="cartAddButton" aria-label="Add to cart">
    <i class="bi bi-cart-plus"></i><span class="d-none d-sm-inline ms-1">Add to cart</span>
